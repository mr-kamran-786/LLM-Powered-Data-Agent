<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Times New Roman, Times, serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#000"/>
    </marker>
  </defs>
  <g fill="none" stroke="#000" stroke-width="1">
    <!-- client side -->
    <rect x="10" y="20" width="150" height="64" rx="4"/>
    <rect x="10" y="132" width="150" height="64" rx="4"/>
    <!-- orchestrator -->
    <rect x="190" y="10" width="360" height="340" rx="4" fill="#f2f2f2"/>
    <rect x="206" y="44" width="150" height="64" rx="4" fill="#fff"/>
    <rect x="384" y="44" width="150" height="64" rx="4" fill="#fff"/>
    <rect x="206" y="156" width="150" height="64" rx="4" fill="#fff" stroke-width="2"/>
    <rect x="384" y="156" width="150" height="64" rx="4" fill="#fff"/>
    <rect x="206" y="268" width="150" height="64" rx="4" fill="#fff"/>
    <rect x="384" y="268" width="150" height="64" rx="4" fill="#fff"/>
    <!-- services -->
    <rect x="580" y="10" width="170" height="70" rx="4"/>
    <rect x="580" y="100" width="170" height="70" rx="4"/>
    <rect x="580" y="190" width="170" height="70" rx="4"/>
    <rect x="580" y="280" width="170" height="70" rx="4"/>
  </g>
  <g fill="none" stroke="#000" stroke-width="1">
    <path d="M85 84V132" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M160 164H190" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M356 76H384" marker-end="url(#a)"/>
    <path d="M482 108V156" marker-end="url(#a)"/>
    <path d="M384 188H356" marker-end="url(#a)"/>
    <path d="M300 156V132H430V108" stroke-dasharray="4 3" marker-end="url(#a)"/>
    <path d="M281 220V268" marker-end="url(#a)"/>
    <path d="M356 300H384" marker-end="url(#a)"/>
    <path d="M550 45H580" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M550 135H580" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M550 225H580" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M550 315H580" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <g fill="#000">
    <text x="22" y="44" font-weight="bold">Web UI</text>
    <text x="22" y="62" font-size="11.5">upload, chat, charts,</text>
    <text x="22" y="76" font-size="11.5">code and data panels</text>
    <text x="22" y="156" font-weight="bold">API backend</text>
    <text x="22" y="174" font-size="11.5">FastAPI, sessions,</text>
    <text x="22" y="188" font-size="11.5">Server-Sent Events</text>

    <text x="206" y="32" font-weight="bold" font-style="italic">Agent orchestrator</text>
    <text x="218" y="68" font-weight="bold">Planner</text>
    <text x="218" y="86" font-size="11.5">JSON plan or</text>
    <text x="218" y="100" font-size="11.5">clarifying question</text>
    <text x="396" y="68" font-weight="bold">Coder</text>
    <text x="396" y="86" font-size="11.5">pandas / SQL as</text>
    <text x="396" y="100" font-size="11.5">tool calls</text>
    <text x="218" y="180" font-weight="bold">Verifier</text>
    <text x="218" y="198" font-size="11.5">rule checks and</text>
    <text x="218" y="212" font-size="11.5">number grounding</text>
    <text x="396" y="180" font-weight="bold">Executor</text>
    <text x="396" y="198" font-size="11.5">runs code in the</text>
    <text x="396" y="212" font-size="11.5">session sandbox</text>
    <text x="218" y="292" font-weight="bold">Critic</text>
    <text x="218" y="310" font-size="11.5">LLM review, at most</text>
    <text x="218" y="324" font-size="11.5">one revision</text>
    <text x="396" y="292" font-weight="bold">Responder</text>
    <text x="396" y="310" font-size="11.5">answer from executed</text>
    <text x="396" y="324" font-size="11.5">evidence only</text>
    <text x="312" y="127" font-size="11" font-style="italic">retry on error</text>
    <text x="289" y="248" font-size="11" font-style="italic">passes</text>

    <text x="592" y="34" font-weight="bold">LLM API</text>
    <text x="592" y="52" font-size="11.5">Gemini via LiteLLM,</text>
    <text x="592" y="66" font-size="11.5">rate limit and fallback</text>
    <text x="592" y="124" font-weight="bold">Code sandbox</text>
    <text x="592" y="142" font-size="11.5">worker per session; no</text>
    <text x="592" y="156" font-size="11.5">network, no secrets, timeout</text>
    <text x="592" y="214" font-weight="bold">Data layer</text>
    <text x="592" y="232" font-size="11.5">DuckDB, SQLite, PostgreSQL;</text>
    <text x="592" y="246" font-size="11.5">read-only, sqlglot guard</text>
    <text x="592" y="304" font-weight="bold">Memory</text>
    <text x="592" y="322" font-size="11.5">SQLite turns, rolling summary,</text>
    <text x="592" y="336" font-size="11.5">live sandbox variables</text>
  </g>
</svg>
